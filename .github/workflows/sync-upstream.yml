name: Sync Upstream Documenso Release & Auto Build

on:
  schedule:
    # Check for upstream releases every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target upstream release tag (e.g. v2.18.0). Leave blank to auto-detect latest.'
        required: false
        default: ''
      force_sync:
        description: 'Force sync and rebuild even if tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  check-and-sync-upstream:
    name: Check, Merge Upstream Release & Apply Brand Patch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      version_tag: ${{ steps.sync.outputs.version_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect and Sync Upstream Release
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.target_tag }}
          FORCE_SYNC: ${{ github.event.inputs.force_sync }}
        run: |
          set -e

          echo "🔗 Configuring upstream remote..."
          git remote add upstream https://github.com/documenso/documenso.git || true
          git fetch upstream --tags

          # 1. Determine Target Tag
          if [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
            echo "📌 Using manually specified tag: $TARGET_TAG"
          else
            echo "🔍 Querying latest release from upstream Documenso..."
            TARGET_TAG=$(gh api repos/documenso/documenso/releases/latest --jq .tag_name || echo "")
            if [ -z "$TARGET_TAG" ]; then
              TARGET_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/documenso/documenso.git | grep -o 'refs/tags/v[0-9.]*' | head -n1 | sed 's|refs/tags/||')
            fi
            echo "📌 Detected latest upstream tag: $TARGET_TAG"
          fi

          if [ -z "$TARGET_TAG" ]; then
            echo "❌ Could not determine upstream tag."
            exit 1
          fi

          # 2. Check if tag already exists in Crove-Sign
          TAG_EXISTS=$(git tag -l "$TARGET_TAG")
          if [ -n "$TAG_EXISTS" ] && [ "$FORCE_SYNC" != "true" ]; then
            echo "✅ Release $TARGET_TAG is already synchronized in Crove-Sign. Skipping."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🔀 Fetching and merging upstream tag $TARGET_TAG..."
          git fetch upstream tag "$TARGET_TAG" --no-tags
          git merge "$TARGET_TAG" --no-edit -m "chore(sync): merge upstream Documenso release $TARGET_TAG"

          echo "🎨 Applying Crove Sign Enterprise Branding Patch..."
          node scripts/patch-crove-branding.mjs

          # 3. Commit branding patch if any changes occurred
          if [ -n "$(git status --porcelain)" ]; then
            echo "💾 Committing branding updates..."
            git add -A
            git commit --no-trailer -m "chore(branding): apply Crove Sign enterprise branding patch for $TARGET_TAG"
          fi

          # 4. Create Release Tag & Push
          echo "🏷️ Creating release tag $TARGET_TAG..."
          git tag -fa "$TARGET_TAG" -m "Release $TARGET_TAG - Crove Sign"
          git push origin main --tags --force

          # 5. Create GitHub Release
          echo "📦 Creating GitHub Release for $TARGET_TAG..."
          gh release create "$TARGET_TAG" \
            --title "Crove Sign $TARGET_TAG" \
            --notes "Automated release synchronized with upstream Documenso $TARGET_TAG. Includes Crove Sign Enterprise Branding, Multi-language (Vietnamese) support, Hybrid Org Sync, and OIDC Authentication." || true

          echo "synced=true" >> "$GITHUB_OUTPUT"
          echo "version_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "🎉 Successfully synchronized release $TARGET_TAG!"
